label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--mut);margin-bottom:3px;display:block}
.bar label{text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--ink);display:inline-flex;gap:5px;align-items:center;margin:0}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #d9ccae;border-radius:8px;font:inherit;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}

input[readonly]{background:#f6f0e0}input[type=checkbox]{width:auto;padding:0;accent-color:var(--gold)}

.mgr{display:flex;gap:6px}.mgr select{flex:0 0 44%;width:auto}.mgr input{flex:1;min-width:0}

html{background-color:#2a2118}
body{min-height:100vh;min-height:100dvh;background:var(--bg)}
